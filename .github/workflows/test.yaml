name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Buildx (Fixes the "Cache export not supported" error)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 2. Login to Docker Hub (Fixes permission denied on push)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Note the added / between username and image name below
          tags: ${{ secrets.DOCKER_USERNAME }}/node-app:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-app:latest
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/node-app:latest,mode=max

      - name: Success
        run: echo "Docker image built and pushed successfully!"