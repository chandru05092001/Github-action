name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Build and push Docker image using official GitHub action
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/node-app:latest
          context: .
          file: ./Dockerfile
          # Optional: enable caching for faster builds
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}node-app:latest
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}node-app:latest,mode=max

      # Step 3 (optional): Log success
      - name: Success
        run: echo "Docker image built and pushed successfully!"